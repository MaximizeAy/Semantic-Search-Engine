name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        # Light set: enough to run the integration-guarded tests WITHOUT pulling
        # torch (sentence-transformers) or a live Supabase — those paths are faked.
        run: |
          pip install numpy rapidfuzz yake better_profanity spacy
          python -m spacy download en_core_web_sm

      - name: Run tests
        run: python -m unittest discover -s tests -t . -v
