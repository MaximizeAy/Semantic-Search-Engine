name = "semantic-search"
main = "src/index.js"
compatibility_date = "2026-01-01"

# Cloudflare Workers AI binding (free plan includes a daily allocation).
[ai]
binding = "AI"

[vars]
SUPABASE_SCHEMA = "semantic_search"
EMBED_MODEL = "@cf/baai/bge-m3"
# SUPABASE_URL can be a plain var; set it with: wrangler secret put SUPABASE_URL
# (or add it here). SUPABASE_KEY MUST be a secret — use the ANON key, not the
# service-role key (search goes through the security-definer RPC, so anon is
# enough and safe to expose at the edge).
#
#   wrangler secret put SUPABASE_URL
#   wrangler secret put SUPABASE_KEY
